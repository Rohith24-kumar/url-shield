services:
  # ── Backend: Node/Express Web Service ──────────────────────────────────────
  - type: web
    name: url-shield-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false   # Set this manually in the Render dashboard

  # ── Frontend: React Static Site ────────────────────────────────────────────
  - type: web
    name: url-shield-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false   # Set to your backend URL, e.g. https://url-shield-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
